# A fully commissioned 40-tab enclosure: circuits, upstream/downstream lugs, a
# BESS with its MID, two PV inverters, and two SPAN Drive EVSEs. A panel definition file
# (load_definition); forty_tab_minimal.ticks.yaml drives it.
schema: panel-sim-definition/1
variant: span
devices:
- class: panel
  id: example-40t-001
  name: Example 40-tab Panel
  metadata:
    vendor-name: Span
    serial-number: example-40t-001
    firmware-version: example/v0.1.0
    hardware-version: rev2
    panel-size: '40'
    main-breaker-rating-a: '200'
    panel-model: MAIN_40
    postal-code: '94103'
    time-zone: America/Los_Angeles
    service-voltage-v: '240.0'
    line-voltage-v: '120.0'
    islandable: 'true'
- class: lugs
  id: lugs-upstream
  name: Upstream lugs
  metadata:
    direction: upstream
- class: lugs
  id: lugs-downstream
  name: Downstream lugs
  metadata:
    direction: downstream
- class: circuit
  id: kitchen-lights
  name: Kitchen Lights
  metadata:
    tab-numbers: '1'
    breaker-rating-a: '15.0'
    default-priority: SOC_THRESHOLD
    relay-behavior: controllable
    placement: downstream-of-lugs
    pcs-priority: '1'
- class: circuit
  id: garage-outlet
  name: Garage Outlet
  metadata:
    tab-numbers: '2'
    breaker-rating-a: '20.0'
    default-priority: NEVER
    relay-behavior: controllable
    placement: downstream-of-lugs
    pcs-priority: '2'
- class: circuit
  id: span-drive-garage
  name: SPAN Drive - Garage
  metadata:
    tab-numbers: 32,34
    breaker-rating-a: '50.0'
    default-priority: OFF_GRID
    relay-behavior: controllable
    placement: downstream-of-lugs
    pcs-priority: '3'
- class: circuit
  id: span-drive-driveway
  name: SPAN Drive - Driveway
  metadata:
    tab-numbers: 35,37
    breaker-rating-a: '50.0'
    default-priority: OFF_GRID
    relay-behavior: controllable
    placement: downstream-of-lugs
    pcs-priority: '4'
- class: circuit
  id: pool-pump
  name: Pool Pump
  metadata:
    tab-numbers: '3'
    breaker-rating-a: '20.0'
    default-priority: OFF_GRID
    relay-behavior: controllable
    placement: downstream-of-lugs
    # Commissioned to receive no backup power: priority locked at OFF_GRID.
    never-backup: 'true'
    pcs-priority: '5'
- class: circuit
  id: solar-inverter
  name: Commissioned PV System
  metadata:
    tab-numbers: 36,38
    breaker-rating-a: '30.0'
    default-priority: NEVER
    relay-behavior: non-controllable
    placement: downstream-of-lugs
    pcs-priority: '6'
    # The circuit a SPAN panel adds for an in-panel PV inverter: relay and
    # priority both locked, priority fixed at NEVER.
    commissioned-system: pv
- class: circuit
  id: solar-inverter-garage
  name: Commissioned PV System
  metadata:
    tab-numbers: 31,33
    breaker-rating-a: '20.0'
    default-priority: NEVER
    relay-behavior: non-controllable
    placement: downstream-of-lugs
    pcs-priority: '7'
    commissioned-system: pv
- class: bess
  id: bess
  name: Battery
  metadata:
    vendor-name: Span
    nameplate-capacity-kwh: '13.5'
    relative-position: UPSTREAM
    model: Example BESS
    initial-soe-kwh: '6.75'
# One pv device per inverter, IDed as a SPAN panel does: <panel>-<serial or
# model>, plus a per-inverter discriminator when there are two or more (here
# the feeding circuit's ID).
- class: pv
  id: example-40t-001-iq8plus-72-2-us-solar-inverter
  name: Solar
  metadata:
    vendor-name: Enphase
    model: IQ8PLUS-72-2-US
    nominal-power-w: '10000.0'
    inverter-type: ac-coupled
    relative-position: IN_PANEL
    feed: solar-inverter
- class: pv
  id: example-40t-001-se3800h-us-solar-inverter-garage
  name: Solar 2
  metadata:
    vendor-name: SolarEdge
    model: SE3800H-US
    nominal-power-w: '3800.0'
    inverter-type: ac-coupled
    relative-position: IN_PANEL
    feed: solar-inverter-garage
- class: evse
  id: evse
  name: SPAN Drive - Garage
  metadata:
    vendor-name: SPAN
    model: SPAN Drive
    part-number: SPN-DRV-001
    serial-number: SIM-EVSE-example-40t-001
    firmware-version: example/v0.1.0
    max-current-a: '32.0'
    feed: span-drive-garage
- class: evse
  id: evse-2
  name: SPAN Drive - Driveway
  metadata:
    vendor-name: SPAN
    model: SPAN Drive
    part-number: SPN-DRV-001
    serial-number: SIM-EVSE-example-40t-001-2
    firmware-version: example/v0.1.0
    max-current-a: '32.0'
    feed: span-drive-driveway
- class: mid
  id: bess-mid
  name: Microgrid Interconnect Device
  metadata:
    vendor-name: Span
bess:
- instance_id: bess
  nameplate_capacity_kwh: 13.5
  max_charge_w: 3500.0
  max_discharge_w: 3500.0
  charge_mode: backup-only
# Off-grid, OFF_GRID circuits shed at once and SOC_THRESHOLD circuits once the
# battery falls below this state of charge.
load_shedding:
  soc_threshold_pct: 20.0
