panel_config:
  serial_number: example-40t-001
  display_name: Example 40-tab Panel
  total_tabs: 40
  main_size: 200
  postal_code: "94103"
  time_zone: America/Los_Angeles
  islandable: true

bess:
  enabled: true
  instance_id: bess
  vendor: Span
  product_name: Example BESS
  nameplate_capacity_kwh: 13.5
  initial_soe_kwh: 6.75
  relative_position: UPSTREAM
  charge_mode: backup-only
  max_charge_w: 3500.0
  max_discharge_w: 3500.0

circuit_templates:
  lighting:
    relay_behavior: controllable
    priority: NICE_TO_HAVE
    breaker_rating: 15
  outlet:
    relay_behavior: controllable
    priority: NICE_TO_HAVE
    breaker_rating: 20
  span_drive:
    relay_behavior: controllable
    priority: OFF_GRID
    breaker_rating: 50
    device_type: evse
  pool_pump:
    # Commissioned to receive no backup power: the priority is locked at
    # OFF_GRID, so `load-shed/priority` publishes no `$settable` and refuses a
    # `/set`. Distinct from the `solar` template below, whose NEVER is an
    # ordinary settable value meaning "never shed".
    relay_behavior: controllable
    priority: OFF_GRID
    never_backup: true
    breaker_rating: 20
  solar:
    relay_behavior: non-controllable
    priority: NEVER
    breaker_rating: 30
    device_type: pv
    nameplate_capacity_w: 10000.0

circuits:
  - id: kitchen_lights
    name: Kitchen Lights
    template: lighting
    tabs: [1]
  - id: garage_outlet
    name: Garage Outlet
    template: outlet
    tabs: [2]
  - id: span_drive_garage
    name: SPAN Drive - Garage
    template: span_drive
    tabs: [32, 34]
  - id: span_drive_driveway
    name: SPAN Drive - Driveway
    template: span_drive
    tabs: [35, 37]
  - id: pool_pump
    name: Pool Pump
    template: pool_pump
    tabs: [3]
  - id: solar_inverter
    name: Solar Inverter
    template: solar
    tabs: [36, 38]

ticks:
  - name: loads and EVSE with some PV
    current_time: 0.0
    grid_online: true
    circuits:
      kitchen_lights: 121.0
      garage_outlet: 122.0
      pool_pump: 1230.0
      span_drive_garage: 2410.0
      span_drive_driveway: 2420.0
      solar_inverter: -2430.0
  - name: PV surplus charges BESS and exports
    current_time: 60.0
    grid_online: true
    circuits:
      kitchen_lights: 121.0
      garage_outlet: 122.0
      pool_pump: 1230.0
      span_drive_garage: 2410.0
      span_drive_driveway: 0.0
      solar_inverter: -8500.0
