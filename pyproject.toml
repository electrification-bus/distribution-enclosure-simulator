[build-system]
# PEP 639 floor: `license = "MIT"` as an SPDX expression plus `license-files` needs
# hatchling >= 1.27. Below it the build SUCCEEDS and quietly emits the legacy
# metadata instead (measured on 1.26.3: `License: MIT`, no `License-Expression`,
# no `License-File`), so an unpinned backend would degrade the published metadata
# without failing anything.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ebus-panel-sim"
# Single source of truth: src/ebus_panel_sim/__init__.py's __version__ (read
# dynamically below). Bump it in ONE place; publish.yml fails the release if the
# git tag disagrees. Matches the convention across the eBus family.
dynamic = ["version"]
description = "Producer-side Homie publisher with embedded behaviour runtime for the eBus convention"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Bill Flood"},
    {name = "Clark Communications Corporation"},
]
keywords = ["homie", "homie5", "mqtt", "iot", "ebus", "simulator", "span", "distribution-enclosure", "energy"]
# `requires-python` is what pip enforces; these are what PyPI indexes and what the
# README's Python badge reads. Kept in step with the floor above, not with the CI
# matrix, which tests the ends of the range (3.11 and 3.14) rather than every point
# in it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Emulators",
    # The package ships py.typed; this is how PyPI surfaces that, on the page and
    # in the "Typed" search filter.
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    # The upper bound is a convention, not a recorded incompatibility. ebus-sdk is
    # 0.x, where a minor release is allowed to break API, so the cap defaults to the
    # next minor. Raise it deliberately once the suite is verified against that
    # minor, as 0.5.2 did for 0.21 (the suite passed unchanged). Do not read the cap
    # as evidence that the next minor is known to break: the bound has moved in
    # lockstep with every floor bump since 0.12 and has never recorded an actual
    # incompatibility. It matters to consumers, not just here, because this cap is
    # what pins anything depending on ebus-panel-sim.
    "ebus-sdk>=0.20.1,<0.22",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    # DEVELOPER.md tells you to run `uv run pre-commit install`, which cannot
    # work unless pre-commit is in this group. Without it the hooks in
    # .pre-commit-config.yaml are configuration nothing executes.
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://ebus.energy"
Repository = "https://github.com/electrification-bus/distribution-enclosure-simulator"
Issues = "https://github.com/electrification-bus/distribution-enclosure-simulator/issues"

[tool.hatch.version]
path = "src/ebus_panel_sim/__init__.py"

[tool.hatch.build.targets.wheel]
# `packages` already carries everything under the package directory, including the
# YAML/JSON wire data (profiles, mapping, catalogs). A `force-include` table naming
# those same trees re-adds each file at a path the archive already holds, which
# hatchling treats as fatal ("A second file is being added to the wheel archive at
# the same path"), so the wheel could never build. Tests exercise the source tree
# and so never caught it. If a data directory ever needs to live outside the
# package, force-include is the right tool; re-adding what `packages` covers is not.
packages = ["src/ebus_panel_sim"]

# The sdist excludes the agent/issue-tracker symlinks into the shadow repo. They are
# untracked, so a clean checkout has none, but a local build would otherwise fail on
# their absolute link targets.
[tool.hatch.build.targets.sdist]
exclude = [".claude", ".beads", "CLAUDE.local.md", "AGENTS.md"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC001/TC002/TC003 (move imports into TYPE_CHECKING blocks) conflicts with mypy's
# preference for runtime-resolvable imports. We rely on `from __future__ import
# annotations` which makes runtime cost a non-issue, so leave imports at module top.
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# No `ebus_sdk` override: the SDK has shipped a `py.typed` marker since 0.13.0, so
# mypy resolves its real types. The `ignore_missing_imports` pair that used to sit
# here is inert against the current pin, and its comment claimed the opposite of
# the truth: that stale premise is what would justify annotating an SDK seam as
# `Any` rather than reaching for the type the SDK actually publishes.
